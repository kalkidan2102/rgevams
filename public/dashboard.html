<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESSGI | Command Dashboard</title>
  <style>
    body { margin: 0; font-family: Inter, Arial, sans-serif; color: #102b38; background: #edf6f2; }
    .container { max-width: 1100px; margin: auto; padding: 50px 24px; }
    .hero { background: linear-gradient(135deg, #0e4a72, #144257); color: white; border-radius: 24px; padding: 36px; }
    h1 { margin: 0 0 12px; font-size: 34px; }
    p { line-height: 1.8; font-size: 15px; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(180px, 1fr)); gap: 14px; margin-top: 24px; }
    .box { background: white; border-radius: 14px; padding: 20px; border: 1px solid #bfd5dd; }
    .box strong { display: block; font-size: 28px; color: #0e4a72; margin-bottom: 6px; }
    .box span { font-size: 11px; font-weight: 900; color: #597983; text-transform: uppercase; }
    a { display: inline-flex; margin-top: 28px; padding: 12px 20px; border-radius: 12px; background: #d48f29; color: #073142; font-weight: 900; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <section class="hero">
      <h1>Command Dashboard</h1>
      <p>The dashboard centralizes real-time seismic, volcanic, GPS, infrastructure and operational intelligence for the Ethiopian geohazard monitoring network.</p>
    </section>
    <section class="grid">
      <article class="box"><strong>24</strong><span>Active Sensors</span></article>
      <article class="box"><strong>03</strong><span>Volcanic Alerts</span></article>
      <article class="box"><strong>11</strong><span>Seismic Streams</span></article>
      <article class="box"><strong>99%</strong><span>Telemetry Health</span></article>
    </section>
    <a href="/">Open Main Portal</a>
  </div>
</body>
</html>
