<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESSGI | Analytics</title>
  <style>
    body { margin: 0; font-family: Inter, Arial, sans-serif; background: #eef6ff; color: #173e46; }
    .wrap { max-width: 980px; margin: auto; padding: 60px 24px; }
    .panel { background: white; border-radius: 24px; padding: 34px; border: 1px solid #cddded; box-shadow: 0 12px 26px rgba(0,0,0,.06); }
    h1 { color: #0e4a72; font-size: 34px; margin: 0 0 12px; }
    p { line-height: 1.88; font-size: 15px; color: #687a83; }
    .cards { display: grid; grid-template-columns: repeat(3, minmax(160px, 1fr)); gap: 14px; margin-top: 20px; }
    .cards article { padding: 16px; border-radius: 14px; background: #f8fbfc; border: 1px solid #bed2d9; }
    .cards strong { color: #006e95; font-size: 24px; } 
    a { display: inline-flex; margin-top: 24px; padding: 12px 20px; text-decoration: none; font-weight: 900; border-radius: 12px; background: #0e4a72; color: white; }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="panel">
      <h1>Analytics Intelligence</h1>
      <p>ESSGI analytics combines real-time seismicity, volcanic activity, GNSS deformation, remote sensing and public reporting conditions for operational intelligence.</p>
      <section class="cards">
        <article><strong>04</strong><br />Signal Streams</article>
        <article><strong>12</strong><br />Active Regions</article>
        <article><strong>M4.8</strong><br />Peak Magnitude</article>
      </section>
      <a href="/">Main Portal</a>
    </section>
  </div>
</body>
</html>
