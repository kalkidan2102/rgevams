<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESSGI | Geospatial Gallery</title>
  <style>
    body { margin: 0; font-family: Inter, Arial, sans-serif; background: #fbf9f5; color: #213d45; }
    .wrap { max-width: 1120px; margin: auto; padding: 54px 24px; }
    h1 { font-size: 34px; color: #0e4a72; margin-bottom: 10px; }
    .gallery { display: grid; grid-template-columns: repeat(3, minmax(180px, 1fr)); gap: 16px; margin-top: 28px; }
    .gallery article { background: white; border-radius: 16px; border: 1px solid #cbd5e1; padding: 16px; min-height: 190px; display: flex; align-items: end; font-weight: 900; color: #083446; background-image: linear-gradient(rgba(14,74,114,.18), rgba(14,74,114,.1)); }
    a { display: inline-flex; margin-top: 26px; padding: 12px 20px; border-radius: 10px; background: #0085c8; color: white; text-decoration: none; font-weight: 900;}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>ESSGI Geospatial Gallery</h1>
    <p>Imagery, monitoring photographs, sensor scenes and regional field observations stored for research, reporting and public communication.</p>
    <section class="gallery">
      <article>Entoto Observatory</article>
      <article>Furi Seismometer</article>
      <article>Danakil Rift</article>
      <article>Satellite Analysis</article>
      <article>GIS Field Mapping</article>
      <article>National Infrastructure</article>
    </section>
    <a href="/">Open Main Portal</a>
  </div>
</body>
</html>
